<main class="flex flex-col items-center justify-center min-h-screen bg-gray-100">
  <div class="w-full max-w-4xl p-6 bg-white rounded-lg shadow-md text-center">
    <app-header></app-header>

    <!-- Navigation Links -->
    <nav class="flex justify-center gap-4 mb-6 pb-4 border-b border-gray-100">
      <a routerLink="/overview" 
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="bg-indigo-50 text-indigo-600 font-semibold"
        class="px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:text-gray-900 hover:bg-gray-50 transition-all duration-200">
        Overview Page
      </a>
      <a routerLink="/" routerLinkActive="bg-indigo-50 text-indigo-600 font-semibold"
        class="px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:text-gray-900 hover:bg-gray-50 transition-all duration-200">
        Tickets
      </a>
    </nav>

    <!-- Route Pages -->
    <router-outlet></router-outlet>
  </div>
</main>
